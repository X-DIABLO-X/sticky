[package]
name = "heyclicky-core"
version = "0.1.0"
description = "HeyClicky Core Rust Backend"
edition = "2021"

[lib]
name = "heyclicky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "heyclicky"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
toml = "0.8"
rtrb = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
cpal = "0.15"
rodio = "0.19"
enigo = "0.6"
xcap = "0.9"
tokio-cron-scheduler = "0.15"
async-trait = "0.1"
base64 = "0.22"
dirs = "6"
hound = "3.5"

[target.'cfg(windows)'.dependencies]
uiautomation = "0.6"
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
