[project]
name = "sidecar-vision"
version = "0.1.0"
description = "HeyClicky Clone - Python Vision Sidecar (FastAPI + OmniParser v2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pillow>=10.2.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "onnxruntime>=1.17.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu>=1.17.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
